name: Backup

# Runs every Sunday 03:00 UTC, and on demand.
# Two jobs in one: it archives the data AND the act of connecting resets
# Supabase's 7-day inactivity timer, so the free project never auto-pauses.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Supabase runs a recent Postgres; the runner's default client can be older
      # and pg_dump refuses to dump a newer server. Install the current client.
      - name: Install postgresql-client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        env:
          # IMPORTANT: use the **Session pooler** connection string from
          # Supabase → Project Settings → Database. GitHub runners are IPv4-only
          # and the direct db.<ref>.supabase.co host is IPv6-only on the free
          # plan, so a direct connection string will fail here.
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          # Call the pgdg-17 binary directly — the runner's default `pg_dump`
          # on PATH resolves to Ubuntu's older bundled client (16.x), which
          # refuses to dump a newer Postgres server (Supabase runs 17.x).
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --no-owner --no-privileges \
            --schema=public \
            -f "backup/moneyteam_$(date +%F).sql"
          gzip "backup/moneyteam_$(date +%F).sql"
          ls -lh backup/

      - name: Download receipt files
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          npm install --no-save @supabase/supabase-js@2.45.4
          node scripts/backup-receipts.mjs
          ls -lh backup/ || true

      # Artifacts are private to people with access to this repo. Do NOT commit
      # dumps into the repository itself — it is public and these files contain
      # every transaction, sponsor and amount.
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: moneyteam-backup-${{ github.run_number }}
          path: backup/
          retention-days: 90