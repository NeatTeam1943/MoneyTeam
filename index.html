<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoneyTeam · Neat Team 1943</title>

    <!-- Every path here is relative. The site is served from a project
         subpath (/MoneyTeam/), and vite.config.js already sets base:'./' for
         the same reason — an absolute "/icon-192.png" would resolve to the
         domain root and 404. -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icon-16.png" />

    <!-- iOS ignores the manifest's icons for "Add to Home Screen" and uses
         this one, so it has to be declared separately. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MoneyTeam" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#000928" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
